[project]
name = "mynab"
version = "0.1.0"
description = "A comprehensive Streamlit dashboard for analyzing YNAB budget data with advanced visualizations and forecasting capabilities"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13.5"
keywords = ["ynab", "budget", "dashboard", "streamlit", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "streamlit~=1.66.1",
    "ynab~=4.4.1",
    "pandas~=3.1.0",
    "plotly~=7.1.0",
    "numpy~=2.5.4",
    "pydantic>=2.11.0",
    "pydantic-settings~=2.16.1",
]

[project.scripts]
mynab = "mynab.app:main"

[project.urls]
Homepage = "https://github.com/yourusername/ynab-budget-dashboard"
Repository = "https://github.com/yourusername/ynab-budget-dashboard"
Documentation = "https://github.com/yourusername/ynab-budget-dashboard#readme"
Issues = "https://github.com/yourusername/ynab-budget-dashboard/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short" 

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest~=9.1.1",
    "ruff~=0.17.2",
    "ty~=0.0.91",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PD",     # pandas-vet
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    "FURB",   # refurb
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
    "TC",     # flake8-type-checking
    "TRY",    # tryceratops
    "FBT",    # flake8-boolean-trap
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "PLR0913", "SLF001", "FBT003"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.pylint]
max-args = 7
max-returns = 4
max-branches = 10

[tool.ty.environment]
python-version = "3.13"
python-platform = "all"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
all = "error"

